apiVersion: v1
kind: ConfigMap

metadata:
  name: laboratory-05-tomcat-context

data:
  laboratory-04.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <Context>
      <Resource
        name="jdbc/LaboratoryDB"
        auth="Container"
        type="javax.sql.DataSource"
        driverClassName="org.postgresql.Driver"
        url="jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
        username="${DB_USER}"
        password="${DB_PASSWORD}"
        maxTotal="20"
        maxIdle="10"
        maxWaitMillis="10000"
      />
    </Context>