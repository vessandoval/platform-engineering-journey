apiVersion: apps/v1
kind: Deployment

metadata:
  name: laboratory-05-nginx

spec:
  replicas: 3

  selector:
    matchLabels:
      app: laboratory-05-nginx

  template:
    metadata:
      labels:
        app: laboratory-05-nginx

    spec:
      containers:
      - name: nginx
        image: nginx:alpine

        ports:
        - containerPort: 80

        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
            
      volumes:
        - name: nginx-config
          configMap:
            name: laboratory-05-nginx-config

 
