# This is a pipeline to understand workflows 

name: pipeline-002

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Run a command
        run: docker --version

      # Runs actions to build a docker image
      - name: Run docker commands
        run: |
            docker build -t laboratory-03:github-actions ./docker/laboratory-03
            docker run -d -p 8080:80 --name laboratory-03 laboratory-03:github-actions
            
      #- name: Inspect container (ps, port, logs and Inspect)
      #  run: |
            # docker ps
            # docker port laboratory-03
            # docker logs laboratory-03
            # docker inspect laboratory-03 --format '{{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}'
            # docker exec laboratory-03 ps aux
            
      - name: Test container and view status container
        run: |
            for i in {1..10}; do
              if curl -f http://localhost:8080; then
                echo "Nginx i ready."
                exit 0
              fi

              echo "Waiting for Nginx..."
              sleep 2
            done

            echo "Nginx did not become ready"
            exit 1
      - name: Run clean environment
        run: |
            docker stop laboratory-03
            docker rm laboratory-03
            
