# This is a pipeline to understand workflows 

name: pipeline-002

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Run a command
        run: docker --version

      # Runs actions to build a docker image
      - name: Run docker commands
        run: |
            docker build -t laboratory-03:github-actions ./docker/laboratory-03
            docker run -d -p 8080:80 --name laboratory-03 laboratory-03:github-actions
      
      # Incorporación de Readiness y Functional Test  
      - name: Readiness check
        run: |
          for i in {0..10}
            if curl -fsS http://localhost:8080 > /dev/null; then
              echo "Container is ready"
              exit 0
            fi

            echo "Container is not ready yet. Attempt $i/10"
            sleep 2
          done

          echo "Container did not become ready"
          exit 1
          
          - name: Functional test
          run: |
            response=$(curl -fsS http://localhost:8080)

            echo "Response received: "
            echo $response"

            echo "$response" | grep -q "LAboratory 03"

            echo "Functional test passed".
          
